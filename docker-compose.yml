version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ia_recruiter_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: recruitment_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: ia_recruiter_backend
    ports:
      - '3001:3001'
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: ia_recruiter_frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

  ai_service:
    build:
      context: ./ai_service_python
    container_name: ia_recruiter_ai
    ports:
      - '8000:8000'
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

volumes:
  pgdata:
